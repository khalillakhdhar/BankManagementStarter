services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-BankDemo!2026Sql}"
    ports:
      - "${SQL_PORT:-1433}:1433"
    volumes:
      - bank-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '$$MSSQL_SA_PASSWORD' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=BankFormationDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-BankDemo!2026Sql};TrustServerCertificate=True"
      Jwt__Secret: "${JWT_SECRET:-ChangeThisDockerJwtSecret_AtLeast32Characters_2026!}"
      Jwt__Issuer: "Bank.Api"
      Jwt__Audience: "Bank.Api.Client"
      DefaultAdmin__Email: "${ADMIN_EMAIL:-admin@bank.local}"
      DefaultAdmin__Password: "${ADMIN_PASSWORD:-Admin123!}"
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  bank-sql-data:
